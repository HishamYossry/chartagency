# Deploys admin/ (Laravel) to the PHP site over SSH on every push to main that touches admin/.
#
# Needs these repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   SSH_HOST         e.g. 123.45.67.89  (hPanel → Advanced → SSH Access)
#   SSH_PORT         e.g. 65002
#   SSH_USER         e.g. u222692328
#   SSH_PRIVATE_KEY  the private key whose public key is added in hPanel → SSH Access
#   ADMIN_PATH       e.g. domains/darkviolet-mole-729566.hostingersite.com/public_html
#
# The server keeps its own .env, storage/ and public/uploads/ — they are never overwritten.
# First install (.env, db:seed, make:filament-user) is done once by hand — see DEPLOY.md.

name: Deploy admin

on:
  push:
    branches: [main]
    paths: ["admin/**", ".github/workflows/deploy-admin.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, intl, gd, zip, fileinfo, mbstring
          coverage: none

      - name: Production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --no-scripts

      - name: SSH key
        working-directory: .
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          ADMIN_PATH: ${{ secrets.ADMIN_PATH }}
        run: |
          test -n "$ADMIN_PATH" || { echo "ADMIN_PATH secret is empty"; exit 1; }
          # No --delete: files only ever get added or replaced, so a wrong path can't wipe anything.
          rsync -az --info=stats1 \
            --exclude='.env' \
            --exclude='storage/' \
            --exclude='public/uploads/' \
            --exclude='bootstrap/cache/*.php' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:$ADMIN_PATH/"

      - name: Migrate and refresh caches
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          ADMIN_PATH: ${{ secrets.ADMIN_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s -- "$ADMIN_PATH" <<'REMOTE'
          set -e
          cd "$1"
          test -f .env || { echo "No .env on the server yet — do the first install from DEPLOY.md"; exit 1; }
          php artisan down --retry=15 || true
          trap 'php artisan up' EXIT   # never leave the admin in maintenance mode, even if a step fails
          php artisan package:discover --ansi   # composer ran with --no-scripts in CI
          php artisan filament:assets           # admin CSS/JS are git-ignored, publish them here
          php artisan migrate --force
          php artisan optimize:clear
          php artisan optimize
          php artisan filament:optimize
          echo "Admin deployed."
          REMOTE
